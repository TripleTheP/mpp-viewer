name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify

  windows-portable:
    name: Portable Windows-Version
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B -ntp -DskipTests package
      - name: Package (jlink + jpackage)
        shell: bash
        run: bash packaging/build-portable.sh
      - name: Smoke test (exe exportiert das Beispielprojekt)
        shell: bash
        run: |
          test -f target/package/MPP-Viewer/MPP-Viewer.exe
          cd target/package/MPP-Viewer
          ./MPP-Viewer.exe --export Beispielprojekt.xml smoke.pdf
          ./MPP-Viewer.exe --export Beispielprojekt.xml smoke.xlsx
          ls -la smoke.*
          test -s smoke.pdf
          test -s smoke.xlsx
      - uses: actions/upload-artifact@v4
        with:
          name: MPP-Viewer-windows-portable
          path: target/package/*.zip
          if-no-files-found: error
