name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify

  windows-portable:
    name: Portable Windows-Version
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build und Tests (Windows)
        shell: bash
        run: mvn -B -ntp package 2>&1 | tee build.log
      - name: Fehlerausgabe als Annotation
        if: failure()
        shell: bash
        run: |
          {
            grep -hE "ERROR|FAIL|Tests run:|expected|Exception" build.log 2>/dev/null | tail -40
            cat target/surefire-reports/*.txt 2>/dev/null | grep -vE "^-+$" | head -40
          } > err.txt || true
          msg=$(sed -e 's/%/%25/g' -e 's/\r//g' err.txt | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Build-Log::$msg"
      - name: Package (jlink + jpackage)
        shell: bash
        run: bash packaging/build-portable.sh
      - name: Smoke test (exe exportiert das Beispielprojekt)
        shell: bash
        run: |
          test -f target/package/MPP-Viewer/MPP-Viewer.exe
          cd target/package/MPP-Viewer
          ./MPP-Viewer.exe --export Beispielprojekt.xml smoke.pdf
          ./MPP-Viewer.exe --export Beispielprojekt.xml smoke.xlsx
          ls -la smoke.*
          test -s smoke.pdf
          test -s smoke.xlsx
          rm smoke.*
      - name: EXE-Metadaten anzeigen
        shell: pwsh
        run: (Get-Item target/package/MPP-Viewer/MPP-Viewer.exe).VersionInfo | Format-List
      - name: Fensterstart – native DLL aus dem Programmordner, nicht aus %TEMP%
        shell: pwsh
        run: |
          $exe = (Resolve-Path target/package/MPP-Viewer/MPP-Viewer.exe).Path
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          $p.Refresh()
          if ($p.HasExited) { throw "MPP-Viewer.exe wurde unerwartet beendet (Exit-Code $($p.ExitCode))." }
          $mods = Get-Process -Id $p.Id | Select-Object -ExpandProperty Modules | Where-Object { $_.ModuleName -like 'flatlaf*' }
          $mods | Format-Table ModuleName, FileName -AutoSize
          Stop-Process -Id $p.Id -Force
          if (-not $mods) { Write-Warning "FlatLaf-DLL wurde nicht geladen (Fensterrahmen ohne native Unterstützung)." }
          elseif ($mods | Where-Object { $_.FileName -notlike "$((Split-Path $exe))*" }) { throw "FlatLaf-DLL wurde außerhalb des Programmordners geladen." }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MPP-Viewer-windows-portable
          path: target/package/*.zip
          if-no-files-found: error
