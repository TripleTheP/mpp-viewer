name: Release

# Ein Release entsteht automatisch, sobald auf main eine neue Version in der pom.xml steht
# (oder ein Tag v* gepusht wird). Bereits vorhandene Releases werden nicht verändert.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release für Windows bauen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version ermitteln
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's:.*<version>\([0-9][^<]*\)</version>.*:\1:p' pom.xml | head -1)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION existiert bereits – nichts zu tun."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v5
        if: steps.version.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        if: steps.version.outputs.skip == 'false'
        shell: bash
        run: |
          mvn -B -ntp versions:set -DnewVersion="${{ steps.version.outputs.version }}" -DgenerateBackupPoms=false
          mvn -B -ntp package
      - name: Package (jlink + jpackage)
        if: steps.version.outputs.skip == 'false'
        shell: bash
        run: bash packaging/build-portable.sh "${{ steps.version.outputs.version }}"
      - name: Smoke test
        if: steps.version.outputs.skip == 'false'
        shell: bash
        run: |
          cd target/package/MPP-Viewer
          ./MPP-Viewer.exe --export Beispielprojekt.xml smoke.pdf
          test -s smoke.pdf
          rm smoke.pdf
      - name: GitHub-Release anlegen
        if: steps.version.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP=$(ls target/package/*.zip)
          {
            echo "## MPP-Viewer $VERSION"
            echo
            echo "**Download:** \`$(basename "$ZIP")\` herunterladen, entpacken und \`MPP-Viewer\\MPP-Viewer.exe\` starten."
            echo "Keine Installation, keine Administratorrechte, kein Java nötig."
            echo
            echo "Schreibgeschützter Viewer für Microsoft-Project-Dateien (.mpp) im Stil von Microsoft Project"
            echo "mit Druck/Seitenansicht und Export nach PDF, Excel, PNG und CSV. Oberfläche Deutsch/Englisch."
          } > release-notes.md
          gh release create "v$VERSION" "$ZIP" --target "$GITHUB_SHA" --title "MPP-Viewer $VERSION" --notes-file release-notes.md
